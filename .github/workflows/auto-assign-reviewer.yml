name: Auto-assign reviewer

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: github.event.pull_request.user.login != 'Banti4750' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request review from maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-reviewer Banti4750
