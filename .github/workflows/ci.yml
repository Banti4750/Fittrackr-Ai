name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fittrackr-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fittrackr-backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  app:
    name: App — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fittrackr-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fittrackr-app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
